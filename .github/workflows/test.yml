name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Docs-only pushes skip the redundant run (build.yml skips them too).
    # PR trigger stays unfiltered so PR checks always report.
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  # Deliberately NOT part of build.yml's quality gate. This drives a real
  # browser against a dev server, so a flake here must never be able to block
  # an image publish — but it does need to run somewhere. Nothing ran it
  # before, and three of the eight specs had been failing unnoticed as a
  # result (a selector that could never match, plus two hydration races).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # playwright.config.ts starts `npm run dev` itself via webServer.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
